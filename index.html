<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OMR Magic</title>
  <meta name="description" content="Take a photo. Let OMR Magic do the boring work. Smart OMR answer sheet checking for teachers.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#EAF2FB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OMR Magic">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <!-- Fonts load without blocking first paint; system fonts are used until they arrive. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">

  <!-- Boot guard: runs before everything else so a missing/broken file can
       never leave a silent blank white page. -->
  <script>
    (function () {
      var problems = [];
      window.__bootProblems = problems;
      // Failed <script>/<link> loads (404 etc.) don't bubble, so listen in the capture phase.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) {
          var url = t.src || t.href;
          if (url.indexOf('fonts.googleapis.com') === -1) problems.push('Could not load: ' + url.replace(location.origin, ''));
        } else if (e.message) {
          problems.push('Script error: ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        problems.push('Error: ' + (e.reason && e.reason.message || e.reason));
      });

      window.addEventListener('load', function () {
        setTimeout(function () {
          var app = document.getElementById('app');
          if (app && app.children.length) return; // app rendered fine
          var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; }); };
          var list = problems.length
            ? '<ul style="text-align:left;margin:12px 0;padding-left:18px;font-size:13px;word-break:break-all">' + problems.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>'
            : '<p style="font-size:13px">No specific error was captured.</p>';
          app.innerHTML =
            '<div style="max-width:420px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif;color:#0A2036">' +
            '<h2 style="margin:0 0 8px">OMR Magic couldn\u2019t start</h2>' +
            '<p style="margin:0;font-size:14px;color:#4C6178">Some app files are missing or failed to load. ' +
            'Every file must sit in the <b>same folder</b> as index.html in your GitHub repo.</p>' + list +
            '<button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:10px;background:#2E74D6;color:#fff;font-weight:700">Reload</button></div>';
        }, 400);
      });

      // Register the service worker from here (not from app.js) so the app stays
      // installable even if a script fails.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./service-worker.js').catch(function (err) {
            console.warn('Service worker registration failed', err);
          });
        });
      }
    })();
  </script>
</head>
<body>
  <div id="app" role="main" aria-live="polite"></div>
  <noscript>OMR Magic needs JavaScript to run.</noscript>

  <!-- Data layer -->
  <script src="./storage.js"></script>
  <script src="./testManager.js"></script>
  <script src="./gradingEngine.js"></script>
  <script src="./studentManager.js"></script>
  <script src="./resultManager.js"></script>
  <script src="./aiVision.js"></script>
  <script src="./answerKeyService.js"></script>
  <!-- OMR / vision engine -->
  <script src="./omrGenerator.js"></script>
  <script src="./imageProcessor.js"></script>
  <script src="./omrScanner.js"></script>
  <script src="./camera.js"></script>
  <!-- Supporting services -->
  <script src="./exportService.js"></script>
  <script src="./batchScanner.js"></script>
  <!-- App shell / UI -->
  <script src="./app.js"></script>
</body>
</html>
